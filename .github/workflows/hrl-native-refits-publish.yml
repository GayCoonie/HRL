name: HRL native sRGB refits and live site
on:
  push:
    paths: ['v2/research/native-srgb-refit/PUBLISH.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hrl-native-refits-site
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and unpack the source transfer
        run: |
          python - <<'PY'
          import json,zlib,base64,hashlib
          from pathlib import Path
          root=Path('v2/research/native-srgb-refit')
          p=json.loads((root/'PUBLISH.json').read_text())
          raw=zlib.decompress(base64.b64decode(''.join((root/f'transfer-{i}.txt').read_text().strip() for i in range(p['parts'])),validate=True))
          assert hashlib.sha256(raw).hexdigest()==p['sha256']
          files=json.loads(raw)
          assert len(files)==p['files']
          for name,item in files.items():
              target=Path(name)
              assert '..' not in target.parts and not target.is_absolute()
              assert name.startswith(('v2/research/native-srgb-refit/','v2/refits-ui/')) or name in ['v2/refits.html','v2/refits.mjs','tools/integrate-refits.py']
              if isinstance(item,str):text=item
              else:
                  base=Path(item['base'])
                  assert str(base).startswith('v2/research/relative-refit/') and '..' not in base.parts
                  original=base.read_bytes()
                  assert hashlib.sha256(original).hexdigest()==item['hash'],str(base)
                  lines=original.decode().splitlines(keepends=True)
                  text=''.join(''.join(lines[b[0]:b[1]]) if isinstance(b,list) else b for b in item['blocks'])
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(text)
          for name,sha in json.loads((root/'SOURCE_HASHES.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
          for f in root.glob('transfer-*.txt'):f.unlink()
          (root/'PUBLISH.json').unlink()
          PY
      - name: Install pinned benchmark and browser tools
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 colour-science==0.4.7 playwright==1.57.0
          python -m playwright install --with-deps chromium
          git clone https://github.com/Grkmyldz148/colorbench.git /tmp/colorbench
          git -C /tmp/colorbench checkout 12b2de215cc5020682e3d245a8c78bce5f0ebbc9
          git clone https://github.com/Grkmyldz148/color-perception-datasets.git /tmp/color-perception-datasets
          git -C /tmp/color-perception-datasets checkout 8641f4e8ebd9d85a34dc0fedc116fa0e58493190
      - name: Verify both native models and unchanged full profiles
        run: |
          python v2/research/native-srgb-refit/prepare-inputs.py
          node v2/research/native-srgb-refit/test.mjs balanced metric
      - name: Run only scored ColorBench and exact native path diagnostics
        run: |
          python v2/research/native-srgb-refit/benchmark.py --colorbench /tmp/colorbench --pool /tmp/color-perception-datasets/datasets
          DENSE=1 node v2/research/native-srgb-refit/visual.mjs baseline balanced metric
          node v2/research/native-srgb-refit/diagnostics.mjs baseline balanced metric
          python v2/research/native-srgb-refit/make-summary.py
      - name: Integrate site navigation and test the real served app
        run: |
          python tools/integrate-refits.py
          node --check v2/refits-ui/app.mjs
          node --check v2/refits-ui/worker.mjs
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/hrl-http.log 2>&1 &
          python v2/research/native-srgb-refit/site-check.py --base http://127.0.0.1:8765/ --root-links --out v2/research/native-srgb-refit/results/browser-local
      - name: Publish all verified models and site additions
        id: publication
        run: |
          git config user.name 'HRL research checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A v2/research/native-srgb-refit v2/refits-ui v2/refits.html v2/refits.mjs tools/integrate-refits.py index.html README.md v2/index.html v2/README.md
          git commit -m 'Publish independent native-sRGB refits and live dual-gamut picker'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for the public Pages deployment
        env:
          PUBLISHED_SHA: ${{ steps.publication.outputs.sha }}
        run: |
          python - <<'PY'
          import os,time,hashlib,urllib.request
          from pathlib import Path
          expected=hashlib.sha256(Path('v2/research/native-srgb-refit/results/balanced.json').read_bytes()).hexdigest()
          url='https://gaycoonie.github.io/HRL/v2/research/native-srgb-refit/results/balanced.json'
          for attempt in range(72):
              try:
                  data=urllib.request.urlopen(url+'?build='+os.environ['PUBLISHED_SHA']+'&attempt='+str(attempt),timeout=15).read()
                  if hashlib.sha256(data).hexdigest()==expected:
                      print('Public Pages serves the exact new native checkpoint.');break
              except Exception as e:print(type(e).__name__,str(e)[:100],flush=True)
              time.sleep(5)
          else:raise RuntimeError('The new public Pages checkpoint did not become available')
          PY
      - name: Test both gamuts on the actual public site
        run: python v2/research/native-srgb-refit/site-check.py --base https://gaycoonie.github.io/HRL/ --root-links --out v2/research/native-srgb-refit/results/browser-live
      - name: Commit the live-site verification receipt
        run: |
          git add v2/research/native-srgb-refit/results/browser-live/verification.json
          git commit -m 'Record public GitHub Pages verification of native and full refits'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrl-native-srgb-refits-site-review
          path: |
            v2/research/native-srgb-refit/
            v2/refits-ui/
            v2/refits.html
            v2/refits.mjs
          retention-days: 30
