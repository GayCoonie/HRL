name: HRL global optimization and codes
on:
  push:
    branches: [main, 'research/global-*']
    paths: ['v2/global.*', 'v2/codes.mjs', 'v2/test-codes.mjs', 'v2/CODES.md', 'v2/research/global-tonal/**', 'v2/boundary-tonal-ui/**', 'site/test-*-browser.py', '.github/workflows/hrl-global.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hrl-global-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Canonical code and release identity checks
        run: |
          node v2/test-codes.mjs
          node site/test-codes-ui.mjs
          node site/test-beta1.mjs
          node --check v2/global.mjs
          git diff --check
      - name: Exercise pickers in both modes
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/hrl-global-http.log 2>&1 &
          python site/test-codes-browser.py --base http://127.0.0.1:8765 --out /tmp/hrl-codes-browser
          python site/test-global-browser.py --base http://127.0.0.1:8765 --out /tmp/hrl-global-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrl-global-verification
          path: |
            /tmp/hrl-codes-browser/
            /tmp/hrl-global-browser/
            /tmp/hrl-global-http.log
          retention-days: 30
