name: HRL relative-domain research
on:
  push:
    branches: [main]
    paths: ["v2/research/relative-domain/RUN"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hrl-relative-domain
  cancel-in-progress: false
jobs:
  verify-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies and pinned sources
        run: |
          python -m pip install 'numpy<3' scipy colour-science
          git clone https://github.com/Grkmyldz148/colorbench.git /tmp/colorbench
          git -C /tmp/colorbench checkout 12b2de215cc5020682e3d245a8c78bce5f0ebbc9
          git clone https://github.com/Grkmyldz148/color-perception-datasets.git /tmp/color-perception-datasets
          git -C /tmp/color-perception-datasets checkout 8641f4e8ebd9d85a34dc0fedc116fa0e58493190
      - name: Build corrected atlas and verify numerical invariants
        run: |
          node v2/research/relative-domain/build.mjs
          node v2/research/relative-domain/test.mjs
      - name: Run only scored generation and measurement judges
        run: python v2/research/relative-domain/benchmark.py --colorbench /tmp/colorbench --pool /tmp/color-perception-datasets/datasets
      - name: Preserve complete research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrl-relative-domain-results
          path: v2/research/relative-domain/results/
          retention-days: 30
      - name: Commit generated evidence and atlas only
        run: |
          git config user.name 'HRL research checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/research/relative-domain/results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record verified relative-domain atlas and scored ColorBench rerun'
          git pull --rebase origin main
          git push origin HEAD:main
