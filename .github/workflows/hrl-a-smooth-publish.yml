name: Build approved A Smooth
on:
  push:
    branches: ['research/a-smooth-publish-20260916']
    paths: ['v2/a-smooth/**', '.github/workflows/hrl-a-smooth-publish.yml']
permissions:
  contents: write
jobs:
  frozen-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exact Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Reproduce frozen assets and benchmark before publishing a built branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init work
          cd work
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout -b research/a-smooth-built-20260916 FETCH_HEAD
          node v2/a-smooth/build-atlas.mjs
          node v2/a-smooth/test.mjs
          node v2/a-smooth/build-viewer.mjs
          node v2/a-smooth/link.mjs
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/a-smooth v2/a-smooth.html README.md v2/README.md v2/index.html
          git commit -m 'Publish approved A Smooth: exact source atlases, verified baseline and standalone picker'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/research/a-smooth-built-20260916
          git rev-parse HEAD
