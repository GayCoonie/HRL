name: HRL equal-span public research inputs
on:
  push:
    branches: ['research/v2-equal-span-inputs-20260916']
    paths: ['.github/workflows/equal-span-inputs.yml']
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Retrieve public research records with provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json, pathlib, hashlib, concurrent.futures
          from urllib.parse import urlparse
          root=pathlib.Path('public-inputs');root.mkdir()
          records=[]
          def fetch(name,url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'HRL color research (public-source retrieval)','Accept':'*/*'})
                  with urllib.request.urlopen(req,timeout=40) as r:
                      data=r.read(55000001);final=r.url;ct=r.headers.get('Content-Type','')
                  if len(data)>55000000: raise RuntimeError('Source exceeds 55 MB research limit')
                  (root/name).write_bytes(data)
                  return {'file':name,'url':url,'final_url':final,'content_type':ct,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'ok':True}
              except Exception as e:return {'file':name,'url':url,'ok':False,'error':str(e)}
          sources=[
            ('schiller-record.json','https://zenodo.org/api/records/572983'),
            ('schiller-page.html','https://zenodo.org/records/572983'),
            ('hrl-published.zip','https://api.github.com/repos/GayCoonie/HRL/zipball/69c58e41ee107c5e1a215552655f619addca4258'),
            ('cie1931.csv','https://files.cie.co.at/CIE_xyz_1931_2deg.csv'),
            ('cie1931-metadata.json','https://files.cie.co.at/CIE_xyz_1931_2deg.csv_metadata.json'),
            ('ayama1987.pdf','https://opg.optica.org/josaa/viewmedia.cfm?uri=josaa-4-6-1136&seq=0'),
            ('wang2022.pdf','https://ira.lib.polyu.edu.hk/bitstream/10397/105929/1/oe-30-25-44896.pdf'),
            ('combvd.xlsx','https://raw.githubusercontent.com/Grkmyldz148/color-perception-datasets/8641f4e8ebd9d85a34dc0fedc116fa0e58493190/datasets/combvd/raw/combvd.xlsx'),
            ('combvd_pairs.json','https://raw.githubusercontent.com/Grkmyldz148/color-perception-datasets/8641f4e8ebd9d85a34dc0fedc116fa0e58493190/datasets/combvd/raw/combvd_pairs.json'),
            ('colorbench_metric_eval.py','https://raw.githubusercontent.com/Grkmyldz148/colorbench/12b2de215cc5020682e3d245a8c78bce5f0ebbc9/core/metric_eval.py')
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              records.extend(pool.map(lambda item:fetch(*item),sources))
          try:
              rec=json.loads((root/'schiller-record.json').read_text())
              for f in rec.get('files',[]):
                  name=f['key'];url=f.get('links',{}).get('self') or f.get('links',{}).get('download')
                  if not url or urlparse(url).hostname not in ('zenodo.org','www.zenodo.org'):continue
                  if '/' in name or '..' in name or f.get('size',0)>55000000:continue
                  row=fetch('schiller-'+name,url)
                  row['published_checksum']=f.get('checksum')
                  if row['ok'] and f.get('checksum','').startswith('md5:'):
                      actual=hashlib.md5((root/row['file']).read_bytes()).hexdigest()
                      row['published_checksum_verified']=actual==f['checksum'][4:]
                      if not row['published_checksum_verified']:raise RuntimeError('Published checksum mismatch')
                  records.append(row)
          except Exception as e: records.append({'file':'schiller-file-discovery','ok':False,'error':str(e)})
          (root/'MANIFEST.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2))
          PY
      - name: Return research inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hrl-equal-span-research-inputs
          path: public-inputs/
          retention-days: 7
          if-no-files-found: error
